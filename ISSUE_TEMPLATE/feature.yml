name: Feature
description: New work or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and why.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria, as a checklist.
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
